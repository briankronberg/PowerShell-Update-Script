name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install test dependencies
        shell: pwsh
        run: |
          # Set-PSRepository throws rather than registering when a runner image
          # arrives without the PSGallery registration, so restore the default
          # registration before touching it.
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 6.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      # One runner for CI and for developers, so the pipeline executes exactly
      # what was run locally. Linting is a tagged test inside the suite rather
      # than a separate step, so there is a single source of truth.
      - name: Run tests
        shell: pwsh
        run: ./test.ps1 -CI

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: testResults.xml
